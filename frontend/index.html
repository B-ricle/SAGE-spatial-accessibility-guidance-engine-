<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f5f7" />
<meta name="description" content="SAGE spatial accessibility monitoring application" />
<title>SAGE | Environment overview</title>
<link rel="stylesheet" href="/src/styles.css" />
<script>
try { const saved = localStorage.getItem('sage-theme'); document.documentElement.dataset.theme = ['light','dark'].includes(saved) ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
</script>
</head>
<body><div id="root"></div><noscript>This application requires JavaScript for monitoring. No live data is available.</noscript><script type="module" src="/src/App.jsx"></script></body>
</html>
